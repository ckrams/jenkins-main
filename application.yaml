apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins-app
  namespace: argocd
spec:
  project: jenkins-app

  source:
    repoURL: https://github.com/ckrams/jenkins-main.git
    targetRevision: main
  destination: 
    server: https://kubernetes.default.svc
    namespace: jenkins

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
